services:
  activemq:
    image: apache/activemq-artemis:latest-alpine
    container_name: activemq
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ARTEMIS_USER: user
      ARTEMIS_PASSWORD: 123456
    volumes:
      - activemq_data:/var/lib/artemis-instance

volumes:
  activemq_data: